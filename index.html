<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encyclopédie des Mobs Minecraft</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        minecraft: ['"Press Start 2P"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #121212;
            background-image: 
                linear-gradient(45deg, #181818 25%, transparent 25%), 
                linear-gradient(-45deg, #181818 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #181818 75%), 
                linear-gradient(-45deg, transparent 75%, #181818 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
        }

        /* Minecraft UI Box Effect (Bevel / Borders) */
        .mc-box {
            background-color: #c6c6c6;
            border-top: 4px solid #ffffff;
            border-left: 4px solid #ffffff;
            border-right: 4px solid #555555;
            border-bottom: 4px solid #555555;
            box-shadow: inset 4px 4px 0px #8b8b8b, inset -4px -4px 0px #373737;
            image-rendering: pixelated;
        }

        .mc-button {
            background-color: #727272;
            border-top: 3px solid #ffffff;
            border-left: 3px solid #ffffff;
            border-right: 3px solid #373737;
            border-bottom: 3px solid #373737;
            box-shadow: inset 2px 2px 0px #aeaeae, inset -2px -2px 0px #555555;
            color: #ffffff;
            text-shadow: 2px 2px #000000;
            transition: all 0.1s ease;
        }

        .mc-button:hover {
            background-color: #8b8b8b;
            border-top: 3px solid #ffffff;
            border-left: 3px solid #ffffff;
            border-right: 3px solid #222222;
            border-bottom: 3px solid #222222;
        }

        .mc-button:active, .mc-button.active {
            background-color: #555555;
            border-top: 3px solid #373737;
            border-left: 3px solid #373737;
            border-right: 3px solid #ffffff;
            border-bottom: 3px solid #ffffff;
            box-shadow: inset 2px 2px 0px #222222, inset -2px -2px 0px #aeaeae;
        }

        .mc-input {
            background-color: #222222;
            border-top: 3px solid #373737;
            border-left: 3px solid #373737;
            border-right: 3px solid #ffffff;
            border-bottom: 3px solid #ffffff;
            box-shadow: inset 2px 2px 0px #000000;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
        }

        .mc-card {
            background-color: #c6c6c6;
            border-top: 3px solid #ffffff;
            border-left: 3px solid #ffffff;
            border-right: 3px solid #555555;
            border-bottom: 3px solid #555555;
            box-shadow: inset 3px 3px 0px #8b8b8b, inset -3px -3px 0px #373737;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #2b2b2b;
            border-left: 2px solid #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #7a7a7a;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #373737;
            border-bottom: 2px solid #373737;
        }

        .pixelated {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <header class="w-full max-w-6xl mb-8 text-center">
        <div class="mc-box p-6 bg-[#2b2b2b] text-[#ffff55] inline-block w-full shadow-2xl relative">
            <h1 class="text-xl md:text-3xl font-bold tracking-wider mb-2 text-yellow-300 drop-shadow-[3px_3px_#000]">
                BLOCKPEDIA v1.16
            </h1>
            <p class="text-[10px] md:text-xs text-gray-300">Encyclopédie Officielle des Mobs Minecraft & Indices de Menace (0-7)</p>
            <div class="absolute top-2 right-2 flex gap-1">
                <span class="w-3 h-3 bg-red-500 inline-block border border-black"></span>
                <span class="w-3 h-3 bg-yellow-500 inline-block border border-black"></span>
                <span class="w-3 h-3 bg-green-500 inline-block border border-black"></span>
            </div>
        </div>
    </header>

    <main class="w-full max-w-6xl flex flex-col gap-6">
        <div class="mc-card p-4 md:p-6 bg-[#c6c6c6] text-black">
            <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                <!-- Search Bar -->
                <div class="w-full md:w-1/3">
                    <label class="block text-[10px] font-bold mb-2 text-neutral-800">RECHERCHER UN MOB :</label>
                    <input type="text" id="searchInput" placeholder="Ex: Creeper, Zombie..." 
                           class="mc-input w-full p-3 text-[10px] outline-none">
                </div>

                <!-- Category Filters -->
                <div class="w-full md:w-auto flex flex-wrap gap-2 justify-center">
                    <button class="mc-button px-3 py-2 text-[8px] md:text-[10px] active filter-btn" data-category="ALL">TOUS</button>
                    <button class="mc-button px-3 py-2 text-[8px] md:text-[10px] filter-btn" data-category="Passif">PASSIF</button>
                    <button class="mc-button px-3 py-2 text-[8px] md:text-[10px] filter-btn" data-category="Neutre">NEUTRE</button>
                    <button class="mc-button px-3 py-2 text-[8px] md:text-[10px] filter-btn" data-category="Hostile">HOSTILE</button>
                    <button class="mc-button px-3 py-2 text-[8px] md:text-[10px] filter-btn" data-category="Boss">BOSS</button>
                </div>

                <!-- Danger Level Filter -->
                <div class="w-full md:w-auto">
                    <label class="block text-[10px] font-bold mb-2 text-neutral-800">FILTRER DANGER :</label>
                    <select id="dangerFilter" class="mc-input w-full p-2.5 text-[9px] outline-none cursor-pointer">
                        <option value="ALL">Tous les niveaux (0-7)</option>
                        <option value="0">0 Étoiles (Inoffensif)</option>
                        <option value="1">1 Étoile (Très Faible)</option>
                        <option value="2">2 Étoiles (Faible)</option>
                        <option value="3">3 Étoiles (Modéré)</option>
                        <option value="4">4 Étoiles (Dangereux)</option>
                        <option value="5">5 Étoiles (Très Dangereux)</option>
                        <option value="6">6 Étoiles (Mortel)</option>
                        <option value="7">7 Étoiles (Cataclysmique)</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="mobGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamically populated via JavaScript -->
        </div>

        <!-- Empty state warning -->
        <div id="noResults" class="hidden text-center p-12 mc-card bg-[#c6c6c6] text-black">
            <p class="text-xs mb-2">AUCUN MOB TROUVÉ DANS CETTE ZONE DU MONDE !</p>
            <p class="text-[8px] text-gray-700">Essayez de modifier vos filtres ou votre recherche.</p>
        </div>
    </main>

    <footer class="w-full max-w-6xl mt-12 text-center text-[8px] text-gray-400">
        <p>Encyclopédie Minecraft non officielle • Sprites officiels Minecraft Wiki</p>
    </footer>

        // État de l'application
        let currentCategory = 'ALL';
        let currentDanger = 'ALL';
        let searchQuery = '';

        // Fonction pour générer les étoiles de dangerosité (0 à 7)
        function renderStars(count) {
            let starsHTML = '';
            for (let i = 1; i <= 7; i++) {
                if (i <= count) {
                    starsHTML += '<span class="text-yellow-400 drop-shadow-[1px_1px_#000]">★</span>';
                } else {
                    starsHTML += '<span class="text-neutral-500">☆</span>';
                }
            }
            return starsHTML;
        }

        // Fonction de rendu de la grille des mobs
        function renderMobs() {
            const grid = document.getElementById('mobGrid');
            const noResults = document.getElementById('noResults');
            
            // Filtrage des données
            const filtered = mobsData.filter(mob => {
                const matchCategory = currentCategory === 'ALL' || mob.category === currentCategory;
                const matchDanger = currentDanger === 'ALL' || mob.danger === parseInt(currentDanger);
                const query = searchQuery.toLowerCase();
                const matchSearch = mob.nameFr.toLowerCase().includes(query) || 
                                    mob.nameEn.toLowerCase().includes(query) || 
                                    mob.desc.toLowerCase().includes(query) ||
                                    mob.biome.toLowerCase().includes(query);
                return matchCategory && matchDanger && matchSearch;
            });

            grid.innerHTML = '';

            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            filtered.forEach(mob => {
                // Badge couleur selon la catégorie
                let badgeColor = 'bg-neutral-700 text-white';
                if (mob.category === 'Passif') badgeColor = 'bg-green-700 text-green-100';
                if (mob.category === 'Neutre') badgeColor = 'bg-blue-700 text-blue-100';
                if (mob.category === 'Hostile') badgeColor = 'bg-red-800 text-red-100';
                if (mob.category === 'Boss') badgeColor = 'bg-purple-800 text-purple-100';

                const card = document.createElement('div');
                card.className = 'mc-card p-4 bg-[#c6c6c6] text-black flex flex-col justify-between transition-transform hover:-translate-y-1';
                card.innerHTML = `
                    <div>
                        <!-- En-tête de la carte -->
                        <div class="flex justify-between items-start mb-3 border-b-2 border-neutral-400 pb-2">
                            <div>
                                <h3 class="text-xs font-bold text-neutral-900 mb-1">${mob.nameFr}</h3>
                                <span class="text-[7px] text-neutral-600 italic">(${mob.nameEn})</span>
                            </div>
                            <div class="w-12 h-12 flex items-center justify-center bg-[#b5b5b5] border border-neutral-500 shadow-inner overflow-hidden">
                                <img src="${mob.sprite}" alt="${mob.nameFr}" class="max-w-full max-h-full pixelated object-contain" onerror="this.onerror=null; this.src='https://placehold.co/48x48/727272/ffffff?text=Mob';">
                            </div>
                        </div>

                        <!-- Badge Catégorie -->
                        <div class="mb-3 flex justify-between items-center">
                            <span class="text-[7px] px-2 py-1 uppercase font-bold border border-black ${badgeColor}">
                                ${mob.category}
                            </span>
                            <div class="text-[8px] bg-[#b5b5b5] px-2 py-1 border border-neutral-500">
                                PV: <span class="text-red-700 font-bold">${mob.hp}</span>
                            </div>
                        </div>

                        <!-- Dangerosité (0-7 étoiles) -->
                        <div class="mb-3 bg-[#b5b5b5] p-2 border border-neutral-500">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[7px] font-bold text-neutral-800">MENACE :</span>
                                <span class="text-[8px] font-bold text-neutral-900">${mob.danger}/7</span>
                            </div>
                            <div class="text-xs tracking-tighter">
                                ${renderStars(mob.danger)}
                            </div>
                        </div>

                        <!-- Description -->
                        <p class="text-[8px] leading-relaxed text-neutral-800 mb-4 bg-neutral-300 p-2 border border-neutral-400">
                            ${mob.desc}
                        </p>
                    </div>

                    <!-- Informations secondaires (Biomes & Loot) -->
                    <div class="text-[7px] text-neutral-700 border-t-2 border-neutral-400 pt-2 flex flex-col gap-1">
                        <div><strong class="text-neutral-900">Biome :</strong> ${mob.biome}</div>
                        <div><strong class="text-neutral-900">Butin :</strong> ${mob.drop}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Gestionnaires d'événements
        document.addEventListener('DOMContentLoaded', () => {
            renderMobs();

            // Recherche en temps réel
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderMobs();
            });

            // Filtre de dangerosité
            document.getElementById('dangerFilter').addEventListener('change', (e) => {
                currentDanger = e.target.value;
                renderMobs();
            });

            // Filtres par catégorie
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.getAttribute('data-category');
                    renderMobs();
                });
            });
        });
    </script>
</body>
</html>
